[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssci"
version = "0.1.0"
description = "Subset-simultaneous conformal inversion for gas arrays"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scikit-learn>=1.3", "matplotlib>=3.7", "joblib>=1.3"]

[project.scripts]
ssci = "ssci.cli:main"

[tool.setuptools.packages.find]
include = ["ssci*"]
